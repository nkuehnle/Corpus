[package]
name = "corpus"
version = "1.0.0-beta.3"
description = "Literature, datasets and study plans for the life sciences"
authors = ["njk639"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "corpus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
corpus-analytics = { path = "analytics" }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
